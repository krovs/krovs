services:
  astro:
    container_name: krovs
    image: oven/bun:latest
    working_dir: /srv/astro
    user: "1000:1000"
    ports:
      - "4321:4321"
    volumes:
      - .:/srv/astro
    environment:
      - CI=true
      - BUN_INSTALL_CACHE_DIR=/tmp/bun-cache
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        rm -f .astro/dev.json &&
        bun run dev --host 0.0.0.0
      "
